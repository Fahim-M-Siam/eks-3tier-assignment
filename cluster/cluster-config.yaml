apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: three-tier-cluster
  region: us-west-2
  version: "1.29"

availabilityZones:
  - us-west-2a
  - us-west-2b

managedNodeGroups:
  - name: node-group-1
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3
    volumeSize: 20
    amiFamily: AmazonLinux2
    iam:
      withAddonPolicies:
        ebs: true
        awsLoadBalancerController: true

vpc:
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
